# Spoken descriptions for chapter 3 (W-54 to W-56). Narration reads these in place of the code, output and table.

[examples.backtest-sundays-2014]
say = "The code runs seasonal naive over the {{out:backtest-sundays-2014:windows}} Sunday cutoffs of 2014 for the subset of eight clients. Each window forecasts the next 24 hours from the eight weeks before its cutoff. It prints the fewest and the most history hours per client over the windows, and how many of the Sunday cutoffs fall on a Portuguese holiday. It then prints the scored hours, the hours of the late starter before its first reading that are left out, and the one client left out of MASE. It prints the mean absolute error and the root mean squared error over the scored hours. Then it prints the mean per-client MASE, the lowest and the highest client's MASE, and the share of the absolute error that the largest client carries."

[examples.history-cut-check]
say = "The code takes the window for Dec 29, 2014 and prints the first and last timestamps of its history, and how many rows it holds. Then it counts the rows of a cut that keeps the reading at the cutoff, which is one row too many, and how many of them are the target day's first reading."

[examples.clock-gap-daily-cutoffs]
say = "The code runs seasonal naive over the daily cutoffs around the March clock change, once on the raw readings and once with the clock-change rule. It prints how many gap hours the actuals hold, {{out:clock-gap-daily-cutoffs:gap hours in actuals}}, and how many of them read zero, {{out:clock-gap-daily-cutoffs:gap hours that read zero}}. Without the rule, it prints the error at those hours, the error at other hours, the median client's ratio of the first to the second, the error at 1am the next day, how many of the next-day forecasts are zero, and the median client's ratio for that next-day hour. Then it prints how many forecasts are not a number without the fill, {{out:clock-gap-daily-cutoffs:NaN forecasts without the fill}}, and the next-day error at 1am and the error at other hours, both with the rule."

[examples.clock-repeat-daily-cutoffs]
say = "The code runs the same comparison around the October clock change. It prints the number of repeat hours in the actuals, {{out:clock-repeat-daily-cutoffs:repeat hours in actuals}}, and without the rule the error at those hours, at other hours, and at 1am the next day, with the median client's ratios for the change hour and for the next day. The next-day error without the rule is the one that copies the doubled hour forward. Then it prints the missing forecasts without the fill, the next-day error with the rule, and the error at other hours with the rule."

[examples.clock-masked-backtest]
say = "The code runs the Sunday backtest twice: once on the raw readings, and once with the clock-change rule, which leaves the clock-change hours out of the scores and fills the history. It prints how many masked hours fall in the scored windows, {{out:clock-masked-backtest:masked hours in scored windows}}. For each run it prints the scored hours, the mean absolute error and the mean per-client MASE. The scored hours differ by the clock-change hours that the rule removes."

[examples.leakage-shift-check]
say = "The code takes the lead client's readings and defines three features: a trailing mean that reads only the hours up to each hour, the same mean moved one hour forward, and a lag of one hour. For the history rows of the three evaluation cutoffs it prints the rows compared, {{out:leakage-shift-check:rows compared}}, and the rows that differ for each feature. The trailing mean differs on {{out:leakage-shift-check:rows differing for the trailing mean}} rows, and the moved mean differs on {{out:leakage-shift-check:rows differing for the peeking mean}}, one at each cutoff. The lag of one hour differs on {{out:leakage-shift-check:rows differing for lag 1}} history rows, so the history test alone passes it. Then it prints the target hours compared, {{out:leakage-shift-check:target hours compared}}, and how many differ for the lag of one hour, {{out:leakage-shift-check:target hours differing for lag 1}}, and for the lag of 24 hours."

[examples.clock-change-census]
say = "The code reads all thirty clients and counts the clock-change hours. It prints the gap rows, {{out:clock-change-census:gap rows}}, how many of them read zero and how many read above zero, how many sit below 5 percent of their neighbouring hours, and the median ratio to the neighbours. It prints the repeat rows, {{out:clock-change-census:repeat rows}}, and their median ratio to the neighbours."
