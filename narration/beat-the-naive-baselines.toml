# Spoken descriptions for chapter 2 (W-54 to W-56). Narration reads these in place of the code, output and table.

[examples.naive-baselines-held-out-week]
say = "The code scores three baselines for the lead client over the seven days of the held-out week. Naive repeats the last reading before each day, seasonal naive repeats the same hour the day before, and average of weeks takes the mean of the same hour over the four weeks before. It prints the number of windows and scored hours, the number of missing forecasts, which is {{out:naive-baselines-held-out-week:missing forecasts}}, and the mean demand, {{out:naive-baselines-held-out-week:mean demand}} kilowatt hours. It then prints each baseline's mean absolute error. For each baseline it also prints the worst window, by its date and error, and the errors for the two days at the start of the week, 25 and 26 December, when the first day is a national holiday."

[examples.mase-scale-leak-check]
say = "The code scores the same three baselines in scaled errors, with two scales. Both scales have their clock-change readings masked, so the only difference between them is the held-out week. The first scale reads only the readings before the held-out week, and the example prints how many readings it uses and the last one, {{out:mase-scale-leak-check:last scale reading from history}}. The second scale reads the whole series, through {{out:mase-scale-leak-check:last reading of whole series}}. The example prints the share of the whole series that the test week makes up, and the test week's own mean day-to-day difference. It then prints both scales in kilowatt hours, the history scale is {{out:mase-scale-leak-check:scale from history clock changes masked}}, and each baseline's MASE with each scale, along with the ratio between the two. The seasonal naive MASE is {{out:mase-scale-leak-check:seasonal naive MASE from history scale}} with the history scale and {{out:mase-scale-leak-check:seasonal naive MASE from whole-series scale}} with the whole series. At four decimal places the two are {{out:mase-scale-leak-check:seasonal naive MASE from history scale at four decimals}} and {{out:mase-scale-leak-check:seasonal naive MASE from whole-series scale at four decimals}}."

[[tables]]
section = "read-a-baselines-score"
starts = "| Baseline | MAE (kWh) | MASE |"
say = "The table has a row for each baseline. The columns are its mean absolute error in kilowatt hours, and its MASE with the history scale. Every MASE is above 1 on this week, which means each baseline's error on this week is larger than seasonal naive's typical error on the history. Naive has the lowest error on both measures."
