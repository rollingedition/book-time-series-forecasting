# Spoken descriptions for chapter 6 (W-54 to W-56). Narration reads these in place of the code, output and table.

[examples.client-identifier-check]
say = "The code fits the global model twice on the four decision cutoffs, from Nov 25 to Dec 3, 2014. These are ordinary days before the held-out week, and the code refuses to run if a scored hour falls on a holiday or in the held-out week. One run has no client identifier. The other gives each client a categorical identifier. Both are scored against the readings that followed, on the book's MASE scale. The code prints the first and last decision cutoffs, the clients, the windows, the scored hours and the holiday hours, which are zero. It prints the pooled mean absolute error and the mean per-client MASE for each run, then the number of clients whose MASE the identifier lowers, which is {{out:client-identifier-check:clients where the identifier lowers MASE}}. It then splits that count between the fifteen largest and the fifteen smallest clients, and prints the largest client and its share of the pooled change. The last line is the verdict. The identifier is kept only when it lowers the mean per-client MASE, and the verdict is {{out:client-identifier-check:identifier kept}}."

[examples.global-model-thirty-clients]
say = "The code forecasts all thirty clients with one global model on the three standard cutoffs, with the start rule applied to each client and the identifier the decision kept. It forecasts the same windows with seasonal naive from the same histories, and scores both against the readings that followed. It prints the counts first: {{out:global-model-thirty-clients:clients scored}} clients, {{out:global-model-thirty-clients:windows}} windows and {{out:global-model-thirty-clients:scored hours}} scored hours. It prints how many clients have no reading before the first cutoff, which is {{out:global-model-thirty-clients:clients left out of MASE}}, and then the clients in the MASE table, which are {{out:global-model-thirty-clients:clients in MASE}}. It then prints how many clients the global model beats seasonal naive for, which is {{out:global-model-thirty-clients:clients where global beats seasonal naive}}, and the clients where seasonal naive wins. Last, for each method, it prints the pooled mean absolute error, the pooled root mean squared error, and the mean per-client MASE. It prints the same figures for the model without the identifier, for reference."

[examples.start-rule-leak-check]
say = "The code tries nine cutoffs and builds each client's history under the start rule. The rule refuses a cutoff when a client has no reading before it, or too little history from its first reading. The code counts the refusals the data's own flag predicts, and compares them with the rule's refusals. For each cutoff, whether accepted or refused, the code replaces every reading from the cutoff onward, once with zeros and once with a value no meter could record, and checks that the history does not change. It also checks that every accepted cutoff holds all thirty clients. It then counts the rows the rule removes, and checks that each one is a zero. The same checks then run on a deliberately broken version, which reads each first reading from the whole series, so that a reader can see each check fail. The real rule prints the cutoffs checked, which are {{out:start-rule-leak-check:cutoffs checked}}, the cutoffs refused, which are {{out:start-rule-leak-check:cutoffs refused by the start rule}}, and the cutoffs accepted, which are {{out:start-rule-leak-check:cutoffs accepted}}. It prints how many accepted cutoffs changed when the future was replaced, which is {{out:start-rule-leak-check:cutoffs whose history changes when the future is poisoned}}. Last, it prints the rows removed, which are {{out:start-rule-leak-check:rows the start rule removes, accepted cutoffs}}, and how many of them are not zero, which is {{out:start-rule-leak-check:removed rows that are not zero}}."

[examples.global-model-raw-starts]
say = "The code prints each late starter's first reading, and the share of zeros in the history of two late starters at each February cutoff. It then runs the global model twice, once with the start rule and once without it, on the standard cutoffs and on the February cutoffs. On the standard cutoffs it prints how many forecast hours differ between the two runs, which is {{out:global-model-raw-starts:forecast hours that differ, standard}}. On the February cutoffs it prints the hours scored and the hours that differ, then the mean absolute error of the late starters as a group, of the other clients, and of each late starter. Both February runs are scored on one scale, read from the first February cutoff, and the code prints each late starter's MASE under each run and the mean MASE of the clients under each run. Last, it prints each late starter's MASE scale with and without the start rule, and the mean MASE of the thirty clients under the two scales, on the same forecasts."
