# Spoken descriptions for chapter 7 (W-54 to W-56). Narration reads these in place of the code, output and table.

[examples.total-bottom-up-and-direct]
say = "The code builds the total of the thirty clients, then chooses between two ways of forecasting it on the four decision windows, judged by mean absolute error on the total. It prints the decision cutoffs and the holiday hours among them, which are {{out:total-bottom-up-and-direct:decision holiday hours}}, then the error of each method, and the method chosen, which is bottom-up. It also compares the direct model's target with and without scaling on the decision windows, and prints the setting chosen, which is unscaled. On the three standard cutoffs it scores both methods beside seasonal naive, on the total's own scale, and prints the scored hours and that scale. It prints the bottom-up total's error with the client identifier removed, for comparison. The last two lines are checks. The first counts the clock-free hours where the total differs from the sum of the thirty readings, which is {{out:total-bottom-up-and-direct:clock-free hours where the total differs from the sum of the thirty clients}}. The second counts the comparisons in which the scale for a scored cutoff changes after readings from that cutoff on are replaced, which is {{out:total-bottom-up-and-direct:scale changes after poisoning readings from each scored cutoff}}."

[examples.total-split-by-share]
say = "The code splits the direct total forecast into client forecasts, each client taking its share of the total from the history before each cutoff. It compares those top-down forecasts with the bottom-up client forecasts. It chooses the per-client method on the decision windows, by mean per-client MASE, and prints the holiday hours among those windows, which are {{out:total-split-by-share:decision holiday hours}}. The bottom-up method is chosen. On the standard cutoffs it prints the scored hours and the mean per-client error and MASE of each method. It counts the clients where top-down has the lower error, and prints the error a split would have given the true total, which is a reference for the split's own error. The last line is a check: how many comparisons change a share after the readings from its cutoff are replaced, which is {{out:total-split-by-share:shares changed after poisoning readings from their cutoff}}."

[[tables]]
section = "compare-the-two-totals"
starts = "| Method | MAE (kWh) | MASE |"
say = "The table has a row for seasonal naive, the bottom-up total and the direct total. The columns are each method's mean absolute error on the total in kilowatt hours, and its MASE on the total's scale. Bottom-up has the lowest error on both measures, and direct sits between it and seasonal naive."
