# Spoken descriptions for chapter 10 (W-54 to W-56). Narration reads these in place of the code, output and table.

[examples.refit-cadence-decision]
say = "The code loads the thirty clients and prepares their readings, then sets the scale for the decision days. It counts the rows one refit reads. Then it runs the same model over the four decision days twice, once refitting every day and once refitting every seven days, and prints each run's refits, its mean absolute error and its mean MASE. Last, it prints the difference between the daily and weekly mean MASE, and the cadence with the lower mean. It then fits a model at each age from zero to six days and prints each age's mean MASE on the same four days. One refit reads {{out:refit-cadence-decision:rows read by one refit}} rows. The daily run's mean MASE is {{out:refit-cadence-decision:mean MASE, daily}} and the weekly run's is {{out:refit-cadence-decision:mean MASE, weekly}}."

[examples.late-fill-decision]
say = "The code makes the lead client's last six readings of the day before each decision day arrive late, at nine in the morning of the decision day. It then forecasts each decision day under two rules for filling a late reading. One repeats the last reading that arrived. The other uses the reading of the same hour a week earlier. It prints how many readings were late, and for each rule the number of forecast hours it scored and the mean absolute error over the lead client's hours from 18:00 to 23:00. Last, it prints the rule with the lower error. The decision days are the only days this example uses. The rule with the lower error is {{out:late-fill-decision:MAE, lead client hours 18 to 23, week fill}} kWh against {{out:late-fill-decision:MAE, lead client hours 18 to 23, forward fill}} kWh for forward fill."

[[blocks]]
section = "score-the-log-as-actuals-arrive"
starts = "ValueError: y column contains null"
say = "This is an error message, not code. It is what the library raised when a forecast was made from an input with a missing value, at the pinned version of mlforecast. The message says, in plain words, that the y column contains null values, and the loop therefore fills the missing reading before it forecasts."

[examples.rolling-refit-seven-days]
say = "The code builds the held-out week's log, one forecast a day from each midnight, with the weekly refit cycle and the late-data fill. It writes each forecast's rows at its cutoff, along with the time the model's readings arrived and the time the forecast's readings arrived. It prints the refit cadence, the refit days in the week, and the number of models the week uses. Then it prints the number of log rows, the calibration residuals behind each hour's band, and how many rows pass each of the two arrival checks. The same check on a leaky run fails for every row. It also prints the readings that arrived late, the inputs filled for the Dec 29 forecast, and the time Dec 28 was complete. Last, it prints each day's mean absolute error, the coverage of its eighty percent band, and the leaky run's error on Dec 25. The log has {{out:rolling-refit-seven-days:log rows}} rows. Of these, {{out:rolling-refit-seven-days:log rows whose model read only readings in by its refit day}} pass the first arrival check, and the leaky run passes {{out:rolling-refit-seven-days:leaky log rows whose model read only readings in by its refit day}}."

[examples.drift-flag-rolling]
say = "The code sets the reference for the flag as the median daily MASE of the twelve calibration days, from December 9 to 20, 2014. It prints that median and the flag line, which is twice the median. It then scores the decision days and prints the largest of them as a multiple of the reference, and how many cross the line. Last, it scores the held-out week, prints each day's MASE, and prints how many days cross the line and which they are. The reference is {{out:drift-flag-rolling:reference, median daily MASE}}, and the flag line is {{out:drift-flag-rolling:flag above, MASE}}. The Dec 25 day has a MASE of {{out:drift-flag-rolling:MASE 2014-12-25}}."

[examples.drift-after-a-change]
say = "The code makes a test copy of the readings in which every reading from December 27, 2014 onward is multiplied by 0.6, for all thirty clients. This change is invented for the test. It runs the held-out week on the changed copy, with the same reference as before, and prints the reference, each day's MASE, and how many days are flagged. Last, it prints the coverage of the eighty percent band on each day. {{out:drift-after-a-change:held-out days flagged}} of the seven days are flagged, and the coverage on Dec 27 is {{out:drift-after-a-change:coverage 80 2014-12-27}}."
