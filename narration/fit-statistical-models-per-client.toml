# Spoken descriptions for chapter 4 (W-54 to W-56). Narration reads these in place of the code, output and table.

[examples.autoets-subset-backtest]
say = "The code fits AutoETS and seasonal naive for each of the eight clients of the subset, at the three standard cutoffs. Each fit uses only the eight weeks before its cutoff, with the clock-change hours masked and filled. The scale for MASE starts each client at its first reading, so the late starter is counted from 2014 January. It prints the form that AutoETS chose in each of the twenty-four fits, and how many of them have a multiplicative part, which is {{out:autoets-subset-backtest:fits with a multiplicative part}}. Then it gives, averaged over the clients, the mean absolute error, the root mean squared error and MASE for both models. It also gives the share of hours inside AutoETS's 95 per cent intervals, which is {{out:autoets-subset-backtest:coverage 95 AutoETS}}, and the number of clients where AutoETS has the lower MASE, which is {{out:autoets-subset-backtest:clients where AutoETS has lower MASE}} of eight. Last, for each client it prints the three forms and the MASE of both models, so the flat forms can be seen by client."

[examples.autoets-forced-season-backtest]
say = "The code is the same backtest with AutoETS's season forced to be additive, the model string ZZA, so that every fit has a daily cycle. The clients, cutoffs, history and scale are those of the default run. It prints the forms, the averaged errors, the coverage of its intervals, which is {{out:autoets-forced-season-backtest:coverage 95 ZZA}}, and the number of clients where it has the lower MASE than seasonal naive, which is {{out:autoets-forced-season-backtest:clients where ZZA has lower MASE}} of eight. It also prints the forms and the MASE of each client, so the client that the default run gave a flat form can be compared with the same client here."

[examples.flat-form-check]
say = "The code takes each of the twenty-four windows of the default run. In each window it fits two forms on the same history: the flat form, with no season, and the additive-season form, which contains the flat one as a special case. It counts the windows in which the seasonal fit has the lower log-likelihood, which is {{out:flat-form-check:seasonal fit has the lower log-likelihood}} of {{out:flat-form-check:windows}}, and the windows in which it has the higher AICc, which is {{out:flat-form-check:seasonal fit has the higher AICc}}. It prints counts only, so no fitted value is quoted."

[examples.arima-subset-backtest]
say = "The code fits the fixed seasonal ARIMA and seasonal naive for the same eight clients, at the same three cutoffs, with the same history, the same clock-change handling and the same MASE scale. It prints the same averaged errors for both models, the MASE gap between seasonal naive and ARIMA, which is {{out:arima-subset-backtest:MASE gap, SeasonalNaive minus ARIMA}}, and the number of clients where the ARIMA model has the lower MASE, which is {{out:arima-subset-backtest:clients where ARIMA has lower MASE}} of eight. The example has no intervals, so it prints no coverage."

[examples.arima-summary-look]
say = "The code fits the same seasonal ARIMA with the statsmodels library, on the lead client's readings before the first standard cutoff. It prints how many hours of history the fit used, which is {{out:arima-summary-look:hours of history}}. Then it prints the names of the three fitted parameters: one autoregressive term, one seasonal autoregressive term at lag twenty-four, and the variance of the error. It prints no values. The list has no intercept, because statsmodels adds one only when the trend is set."

[examples.late-starter-trim]
say = "The code first checks the start rule on the whole subset. It prints how many hours the rule drops, which is {{out:late-starter-trim:start rule drops, SUBSET8}}, and how many hours carry the late-start flag, which is {{out:late-starter-trim:flagged before_first_reading, SUBSET8}}. The two match. Then, for the late starter MT_115 and three February cutoffs, it fits AutoETS twice at each cutoff: once on the raw eight weeks, and once on the history from the client's first reading. For each cutoff it prints the share of zero hours in the raw history, and for each fit it prints the history length, the chosen form, the mean forecast and the mean actual, and the mean absolute error for the day. The raw history's mean absolute error over three windows is {{out:late-starter-trim:MAE raw, three windows}}, and the start rule's is {{out:late-starter-trim:MAE start, three windows}}. Last, it gives the two errors over the two days after the first, which are {{out:late-starter-trim:MAE raw, 2014-02-15 and 2014-02-28}} for the raw history and {{out:late-starter-trim:MAE start, 2014-02-15 and 2014-02-28}} for the start rule."

[[tables]]
section = "compare-models-on-the-same-cutoffs"
starts = "| Model | MAE (kWh) |"
say = "The table has a row for each model: seasonal naive, AutoETS, AutoETS with the season forced, and ARIMA. Each row gives the mean absolute error and the root mean squared error in kilowatt hours, the MASE, and the number of clients where the model beats seasonal naive on MASE. Seasonal naive has a mean absolute error of {{out:autoets-subset-backtest:MAE SeasonalNaive}} kilowatt hours and a MASE of {{out:autoets-subset-backtest:MASE SeasonalNaive}}. AutoETS has {{out:autoets-subset-backtest:MAE AutoETS}} and {{out:autoets-subset-backtest:MASE AutoETS}}. With the season forced it has {{out:autoets-forced-season-backtest:MAE ZZA}} and {{out:autoets-forced-season-backtest:MASE ZZA}}. ARIMA has {{out:arima-subset-backtest:MAE ARIMA}} and {{out:arima-subset-backtest:MASE ARIMA}}. So the default AutoETS has the lowest mean error and the highest MASE of the four rows, and the two measures disagree."
