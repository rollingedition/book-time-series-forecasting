# Spoken descriptions for chapter 8 (W-54 to W-56). Narration reads these in place of the code, output and table.

[[blocks]]
section = "build-intervals-from-residuals"
starts = "lower = f + Q((1 - L/100) / 2)"
say = "Two lines give the bounds. The lower bound is the forecast plus the empirical quantile of the calibration residuals at the level's lower tail, and the upper bound is the forecast plus the quantile at the upper tail, for a level of L percent."

[examples.conformal-three-windows]
say = "The code builds the library's own prediction intervals, with three calibration windows, and refits the global model at each of the three standard cutoffs, Dec 29, Dec 30 and Dec 31, 2014. Each cutoff's bands are calibrated on the three cutoffs before it. It prints the number of scored hours, then the highest coverage that three windows allow at any level, which is {{out:conformal-three-windows:highest coverage three windows allow, any level}}. It prints the coverage of the 80 percent bands, which is {{out:conformal-three-windows:coverage at 80}}, and their mean width in kilowatt hours, {{out:conformal-three-windows:mean width at 80}}, with the simulated coverage for exchangeable errors beside it, {{out:conformal-three-windows:simulated coverage at 80, exchangeable errors}}. It prints the coverage on each day, which falls from {{out:conformal-three-windows:coverage at 80 on 2014-12-29}} on Dec 29 to {{out:conformal-three-windows:coverage at 80 on 2014-12-31}} on Dec 31, beside the mean absolute error on each day. It then prints the 95 percent bands, which cover {{out:conformal-three-windows:coverage at 95}}, with their mean width."

[examples.conformal-decision-windows]
say = "The code makes the two choices of the calibration design on four decision windows, Nov 25 to Dec 3, 2014, with twelve calibration days from Nov 9 to 20 before them. It prints the calibration facts, then four variants: unscaled and scaled residuals, each with and without the finite-sample levels. For each it prints the coverage and the interval score at 80 and 95 percent, and the coverage at 80 of the worst client. The scaled variant's worst client is covered at {{out:conformal-decision-windows:scaled, lowest client coverage at 80}}, against {{out:conformal-decision-windows:unscaled, lowest client coverage at 80}} without the scale. The last lines show the total's 80 percent band with and without the finite-sample levels."

[examples.figure-client-coverage-scaled]
say = "The code plots each client's coverage at 80 on the four decision windows, once with the residuals unscaled and once scaled, one point per client, sorted from the lowest to the highest. It prints the lowest client coverage for each variant, which is {{out:figure-client-coverage-scaled:unscaled residuals, lowest client coverage at 80}} without the scale and {{out:figure-client-coverage-scaled:scaled residuals, lowest client coverage at 80}} with it. It then prints how many clients sit within 0.1 of 0.8 for each variant: {{out:figure-client-coverage-scaled:unscaled residuals, clients within 0.1 of 0.8}} without the scale and {{out:figure-client-coverage-scaled:scaled residuals, clients within 0.1 of 0.8}} with it."

[examples.conformal-earlier-windows]
say = "The code calibrates on twelve ordinary days, Dec 9 to 20, 2014, and scores the three standard cutoffs. It prints the number of calibration windows, the holiday hours in them, which is {{out:conformal-earlier-windows:holiday hours in calibration}}, and the calibration hours shared with the scored week, which is {{out:conformal-earlier-windows:calibration hours shared with scored}}. Each client's residuals are divided by that client's own scale before they are pooled. It prints the coverage, the mean width and the interval score of the 80 and 95 percent bands, which cover {{out:conformal-earlier-windows:coverage at 80}} and {{out:conformal-earlier-windows:coverage at 95}} of the client hours. It then names the largest client by its average load, and prints that client's coverage at 80 with the unscaled residuals, which is {{out:conformal-earlier-windows:largest client coverage at 80, unscaled residuals}}. The lowest client coverage at 80 with the scaled bands is {{out:conformal-earlier-windows:lowest client coverage at 80}}. The last two lines compare the coverage at 80 from the three calibration days nearest the scored week, and the coverage with finite-sample quantile levels."

[examples.buy-ahead-level-by-cost]
say = "The code sets the bands for the total, the hourly sum of the thirty clients, from the same twelve calibration days, at 80 percent only, because twelve residuals cannot support a 95 percent band. It prints the two illustrative costs, one for a kilowatt hour bought short and one for a kilowatt hour bought and not used, and the critical fractile they give, which is {{out:buy-ahead-level-by-cost:critical fractile}}. It prints the scored hours, the coverage of the total's 80 percent bands on each day, which is {{out:buy-ahead-level-by-cost:total coverage at 80}} over all three days, and the mean absolute error by day, beside it. It then prints the realised mean cost and the share of hours in which the reading was above the purchase at 0.50, the critical fractile and 0.90. At the critical fractile the mean cost is {{out:buy-ahead-level-by-cost:mean cost at 0.75}}. The last lines print the quantile loss, scaled by the two costs, beside the mean cost at the critical fractile, which is the same figure, and compare the total's bound with the sum of the clients' bounds."

[examples.total-band-miss-runs]
say = "The code builds the total's 80 percent bands from the twelve calibration days, as the purchase example does, and marks each scored hour, in time order, as inside or outside the band. Of {{out:total-band-miss-runs:scored hours}} hours, {{out:total-band-miss-runs:hours missed at 80}} are outside. It prints the longest run of missed hours in a row, which is {{out:total-band-miss-runs:longest run of missed hours}}, and the share of misses whose next hour also misses, which is {{out:total-band-miss-runs:misses followed by a miss}}. It then shuffles the same hours ten thousand times with a fixed seed and prints both measures again: the longest run averages {{out:total-band-miss-runs:longest run of missed hours, shuffled, mean}}, and the share of shuffles with a run as long as the real one is {{out:total-band-miss-runs:share of shuffles with a run this long}}."

[examples.figure-total-band-misses]
say = "The code plots the total's {{out:figure-total-band-misses:scored hours}} scored hours, the actual total and its 80 percent band, with each hour outside the band marked. It prints the hours missed at 80, which is {{out:figure-total-band-misses:hours missed at 80}}, and the longest run of missed hours, which is {{out:figure-total-band-misses:longest run of missed hours}}. It also prints the hour the longest run starts, which is {{out:figure-total-band-misses:longest run starts}}."

[[tables]]
section = "measure-coverage-on-held-out-days"
starts = "| Scored day | Error of the total, kWh"
say = "The table has a row for each of the three scored days. Each row gives the total's mean absolute error that day, in kilowatt hours, and the coverage of the total's 80 percent bands that day. Dec 31 has the largest error, and Dec 29 has the lowest coverage."

[[tables]]
section = "choose-the-level-from-the-cost-of-error"
starts = "| Level | Mean cost | Hours short |"
say = "The table has a row for each of the three levels: 0.50, the critical fractile at {{out:buy-ahead-level-by-cost:critical fractile}}, and 0.90. Each row gives the mean cost of buying at that level on the scored days, and the share of hours in which the purchase fell short."

