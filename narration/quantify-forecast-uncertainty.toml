# Spoken descriptions for chapter 8 (W-54 to W-56). Narration reads these in place of the code, output and table.

[[blocks]]
section = "build-intervals-from-residuals"
starts = "lower = f + Q((1 - L/100) / 2)"
say = "Two lines give the bounds. The lower bound is the forecast plus the empirical quantile of the calibration residuals at the level's lower tail, and the upper bound is the forecast plus the quantile at the upper tail, for a level of L percent."

[examples.conformal-three-windows]
say = "The code builds the library's own prediction intervals, with three calibration windows, and refits the global model at each of the three standard cutoffs, Dec 29, Dec 30 and Dec 31, 2014. Each cutoff's bands are calibrated on the three cutoffs before it. It prints the number of scored hours, then the highest coverage that three windows allow at any level, which is {{out:conformal-three-windows:highest coverage three windows allow, any level}}. It prints the coverage of the 80 percent bands, which is {{out:conformal-three-windows:coverage at 80}}, and their mean width in kilowatt hours, {{out:conformal-three-windows:mean width at 80}}, with the simulated coverage for exchangeable errors beside it, {{out:conformal-three-windows:simulated coverage at 80, exchangeable errors}}. It prints the coverage on each day, which falls from {{out:conformal-three-windows:coverage at 80 on 2014-12-29}} on Dec 29 to {{out:conformal-three-windows:coverage at 80 on 2014-12-31}} on Dec 31, beside the mean absolute error on each day. It then prints the 95 percent bands, which cover {{out:conformal-three-windows:coverage at 95}}, with their mean width."

[examples.conformal-decision-windows]
say = "The code makes the two choices of the calibration design on four decision windows, Nov 25 to Dec 3, 2014, with twelve calibration days from Nov 9 to 20 before them. It prints the calibration facts, then four variants: unscaled and scaled residuals, each with and without the finite-sample levels. For each it prints the coverage and the interval score at 80 and 95 percent, and the coverage at 80 of the worst client. The scaled variant's worst client is covered at {{out:conformal-decision-windows:scaled, lowest client coverage at 80}}, against {{out:conformal-decision-windows:unscaled, lowest client coverage at 80}} without the scale. The last lines show the total's 80 percent band with and without the finite-sample levels."

[examples.conformal-earlier-windows]
say = "The code calibrates on twelve ordinary days, Dec 9 to 20, 2014, and scores the three standard cutoffs. It prints the number of calibration windows, the holiday hours in them, which is {{out:conformal-earlier-windows:holiday hours in calibration}}, and the calibration hours shared with the scored week, which is {{out:conformal-earlier-windows:calibration hours shared with scored}}. Each client's residuals are divided by that client's own scale before they are pooled. It prints the coverage, the mean width and the interval score of the 80 and 95 percent bands, which cover {{out:conformal-earlier-windows:coverage at 80}} and {{out:conformal-earlier-windows:coverage at 95}} of the client hours. It then names the largest client by its average load, and prints that client's coverage at 80 with the unscaled residuals, which is {{out:conformal-earlier-windows:largest client coverage at 80, unscaled residuals}}. The lowest client coverage at 80 with the scaled bands is {{out:conformal-earlier-windows:lowest client coverage at 80}}. The last two lines compare the coverage at 80 from the three calibration days nearest the scored week, and the coverage with finite-sample quantile levels."

[examples.buy-ahead-level-by-cost]
say = "The code sets the bands for the total, the hourly sum of the thirty clients, from the same twelve calibration days, at 80 percent only, because twelve residuals cannot support a 95 percent band. It prints the two illustrative costs, one for a kilowatt hour bought short and one for a kilowatt hour bought and not used, and the critical fractile they give, which is {{out:buy-ahead-level-by-cost:critical fractile}}. It prints the scored hours, the coverage of the total's 80 percent bands on each day, which is {{out:buy-ahead-level-by-cost:total coverage at 80}} over all three days, and the mean absolute error by day, beside it. It then prints the realised mean cost and the share of hours in which the reading was above the purchase at 0.50, the critical fractile and 0.90. At the critical fractile the mean cost is {{out:buy-ahead-level-by-cost:mean cost at 0.75}}. The last lines check that the quantile loss, scaled by the two costs, equals that cost, and compare the total's bound with the sum of the clients' bounds."
