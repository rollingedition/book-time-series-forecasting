[concepts.relations]
measured-from = ["coverage"]

[[concepts]]
id = "critical-fractile"
term = "critical fractile"
definition = "The level `cu / (cu + co)` is the critical fractile of the newsvendor model."
formula = "tau = cu / (cu + co)"
section = "choose-the-level-from-the-cost-of-error"
