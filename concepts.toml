[[concepts]]
id = "quantile-loss"
term = "quantile loss"
aliases = ["pinball loss"]
context = "model-evaluation"
definition = "The quantile loss is `tau * (y - q)` when the reading `y` is at or above the purchase `q`, and `(1 - tau) * (q - y)` when it is below."
section = "choose-the-level-from-the-cost-of-error"
example = "buy-ahead-level-by-cost"

