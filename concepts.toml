[[concepts]]
id = "interval-score"
term = "interval score"
context = "model-evaluation"
definition = "The interval score adds a band's width to a penalty for each reading that misses the band, the penalty growing with the distance of the miss and scaled by 2 over the miss rate"
section = "calibrate-on-earlier-windows"
example = "conformal-decision-windows"

[concepts.relations]
measured-from = ["prediction-interval"]

[[concepts]]
id = "finite-sample-levels"
term = "finite-sample levels"
aliases = ["finite-sample correction"]
definition = "Each new residual is one more among n + 1, so the finite-sample levels move outward a little: each quantile level moves to `floor((n + 1) * a) / n` for the lower bound and `ceil((n + 1) * (1 - a)) / n` for the upper, where `n` is the number of residuals and `a` the tail share."
section = "calibrate-on-earlier-windows"
example = "conformal-decision-windows"

[[concepts]]
id = "coverage-gap"
term = "coverage gap"
